name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout KOReader iOS
        uses: actions/checkout@v4
        with:
          repository: hezi/koreader-ios
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install autoconf automake bash binutils cmake coreutils \
            findutils gettext gnu-getopt libtool make meson nasm ninja \
            pkgconf sdl3 util-linux xcodegen

      - name: Configure GNU tools
        run: |
          BREW_PREFIX=$(brew --prefix)
          echo "$BREW_PREFIX/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/gnu-getopt/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/util-linux/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Build KOReader (Release Mode)
        run: |
          # Tự động quét tìm file .xcodeproj bất kể nó nằm ở thư mục nào
          XCODEPROJ=$(find . -name "KOReader.xcodeproj" -print -quit)
          if [ -z "$XCODEPROJ" ]; then
            echo "Lỗi: Không tìm thấy bất kỳ file KOReader.xcodeproj nào!" && exit 1
          fi
          echo "Tìm thấy dự án tại: $XCODEPROJ"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme KOReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package IPA
        run: |
          # Quét tìm file KOReader.app trong thư mục đầu ra
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "KOReader.app" -type d -path "*/Release-iphoneos/*" -print -quit)
          
          if [ -z "$APP" ]; then
            echo "Lỗi: Không tìm thấy file KOReader.app đã build!" && exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KOReader-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-iPad
          path: KOReader-iOS.ipa
