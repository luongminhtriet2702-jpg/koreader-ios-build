name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout KOReader iOS
        uses: actions/checkout@v4
        with:
          repository: hezi/koreader-ios
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install autoconf automake bash binutils cmake coreutils \
            findutils gettext gnu-getopt libtool make meson nasm ninja \
            pkgconf sdl3 util-linux xcodegen

      - name: Configure GNU tools
        run: |
          echo "$(brew --prefix)/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-getopt/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/util-linux/bin" >> "$GITHUB_PATH"

      - name: Verify environment
        run: |
          make --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          ./platform/ios/check-prereqs.sh

      - name: Generate Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Build KOReader
        run: |
          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find built app
        run: |
          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphoneos/KOReader.app" \
            -print

      - name: Package IPA
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphoneos/KOReader.app" \
            -print -quit)

          test -n "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/KOReader.app
          zip -qry KOReader-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-iOS-IPA
          path: KOReader-iOS.ipa
