name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout KOReader iOS
        uses: actions/checkout@v4
        with:
          repository: hezi/koreader-ios
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install autoconf automake bash binutils cmake coreutils \
            findutils gettext gnu-getopt libtool make meson nasm ninja \
            pkgconf sdl3 util-linux xcodegen

      - name: Configure GNU tools
        run: |
          echo "$(brew --prefix)/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-getopt/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/util-linux/bin" >> "$GITHUB_PATH"

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Xcode project
        run: |
          make TARGET=ios xcodeproj

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KOReader.app Payload/
          zip -r KOReader-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-iOS-IPA
          path: KOReader-iOS.ipa
