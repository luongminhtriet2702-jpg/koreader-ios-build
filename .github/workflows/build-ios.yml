name: Build KOReader iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:

      - name: Checkout KOReader iOS
        uses: actions/checkout@v4
        with:
          repository: hezi/koreader-ios
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            bash \
            binutils \
            cmake \
            coreutils \
            findutils \
            gettext \
            gnu-getopt \
            libtool \
            make \
            meson \
            nasm \
            ninja \
            pkgconf \
            sdl3 \
            util-linux \
            xcodegen

      - name: Configure GNU tools
        run: |
          echo "$(brew --prefix)/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-getopt/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/util-linux/bin" >> "$GITHUB_PATH"

      - name: Check environment
        run: |
          make --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          ./platform/ios/check-prereqs.sh

      - name: Create Info.plist
        run: |
          echo "Creating platform/ios/Info.plist..."

          test -f platform/ios/Info.plist.in

          sed 's/@VERSION@/0.0.0/g' \
            platform/ios/Info.plist.in \
            > platform/ios/Info.plist

          plutil -lint platform/ios/Info.plist

          echo "Info.plist created successfully."

      - name: Generate Xcode project
        run: |
          make TARGET=ios xcodeproj

          test -f KOReader.xcodeproj/project.pbxproj

          echo "Xcode project generated successfully."

      - name: Build KOReader
        run: |
          set -o pipefail

          xcodebuild \
            -project KOReader.xcodeproj \
            -scheme KOReader \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Find KOReader.app
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -path "*/Build/Products/Debug-iphoneos/KOReader.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "KOReader.app was not found."
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          echo "$APP" > koreader_app_path.txt

      - name: Package IPA
        run: |
          APP=$(cat koreader_app_path.txt)

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/KOReader.app

          zip -qry KOReader-iOS.ipa Payload

          ls -lh KOReader-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-iOS-IPA
          path: KOReader-iOS.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KOReader-Build-Log
          path: xcodebuild.log
          if-no-files-found: ignore
